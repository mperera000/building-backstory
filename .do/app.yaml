# DigitalOcean App Platform spec. Create with: doctl apps create --spec .do/app.yaml
# (or in the dashboard: Create App → GitHub repo → it picks this file up).
name: building-backstory
region: sfo
services:
  - name: web
    github:
      repo: REPLACE_WITH_GITHUB_OWNER/building-backstory
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci --omit=dev
    run_command: npm start
    http_port: 3300
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - { key: NODE_ENV, value: production }
      - { key: GEMINI_API_KEY, type: SECRET, scope: RUN_TIME }
      - { key: TYPESAFE_API_KEY, type: SECRET, scope: RUN_TIME }
      - { key: BRIGHTDATA_API_KEY, type: SECRET, scope: RUN_TIME }
      - { key: BRIGHTDATA_SERP_ZONE, scope: RUN_TIME }
      - { key: BRIGHTDATA_UNLOCKER_ZONE, scope: RUN_TIME }
      - { key: SENTRY_DSN, type: SECRET, scope: RUN_TIME }
